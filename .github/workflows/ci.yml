name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build
        env:
          # dummy values so `next build` can statically analyze the app —
          # no real database or secrets are needed just to build
          DATABASE_URL: 'postgresql://user:pass@localhost:5432/prabodha_ci'
          JWT_SECRET: 'ci_placeholder_secret'
          SUPABASE_URL: 'https://placeholder.supabase.co'
          SUPABASE_SERVICE_ROLE_KEY: 'placeholder'
